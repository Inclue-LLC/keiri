# Render（https://render.com）へのデプロイ設定。Dashboard の「New → Blueprint」でこのリポジトリを選ぶと作成される
services:
  - type: web
    name: keiri
    runtime: python
    plan: starter            # データを保存するディスクを使うため有料プランが必要
    region: singapore        # 日本に最も近いリージョン
    branch: claude/wizardly-clarke-xstnyy
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    disk:
      name: keiri-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TZ
        value: Asia/Tokyo
      - key: KEIRI_DATA_DIR
        value: /var/data
      - key: KEIRI_COOKIE_SECURE
        value: "1"
      - key: KEIRI_SECRET_KEY
        generateValue: true
      # 最初のログインユーザー（作成時に Render の画面で入力。ユーザーがいない場合のみ使われる）
      - key: KEIRI_INITIAL_USER
        sync: false
      - key: KEIRI_INITIAL_PASSWORD
        sync: false
