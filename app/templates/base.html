<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}入金消込{% endblock %} | 入金消込</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if user %}
<header class="topbar">
  <a class="brand" href="/">入金消込</a>
  <nav>
    <a href="/">請求書</a>
    <a href="/transactions">入金明細</a>
    <a href="/upload">CSV取込</a>
    <a href="/clients">取引先・別名</a>
    <a href="/users">ユーザー</a>
  </nav>
  <form method="post" action="/logout" class="logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <span class="muted">{{ user.username }}</span>
    <button type="submit" class="link">ログアウト</button>
  </form>
</header>
{% endif %}
<main>
  {% for kind, message in flashes %}
  <div class="flash flash-{{ kind }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
